name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# The result of an older run is not needed after a newer push.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Autolith release that AUI is checked against. AUI loads the client code
  # of Autolith, so the two are updated together.
  AUTOLITH_REF: v0.67.58

jobs:
  # Autolith is installed from a release by the Autolith installer, and AUI is
  # built from source against it. People who do not develop Autolith have this
  # setup.
  macos-release:
    name: macOS arm64, Autolith from a release
    runs-on: macos-15
    timeout-minutes: 75
    env:
      AUI_LIGHTFAST_ROOT: ${{ github.workspace }}/lightfast
    steps:
      - uses: actions/checkout@v5
        with:
          path: aui

      - uses: actions/checkout@v5
        with:
          repository: lambda-symbolics/lightfast
          path: lightfast

      - name: Install tools
        run: |
          brew install fltk
          fltk-config --version

      # Run the Autolith installer with the release to install. The release is
      # downloaded from the place where it is published.
      - name: Install the Autolith release
        env:
          AUTOLITH_RELEASE_BASE_URL: https://github.com/lambda-symbolics/autolith/releases/download
        run: |
          curl --fail --silent --show-error --location --retry 3 https://sh.lambda-symbolics.com/autolith |
            sh -s -- --version "$AUTOLITH_REF"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/autolith" --version

      - name: Build AUI
        run: |
          cd aui
          script/build
          ls -la build/aui
          cat build/autolith

      - name: Run the tests
        run: |
          cd aui
          script/check --suite aui

      - name: Exercise the interface
        run: |
          cd aui
          script/exercise
          script/exercise-unslop

      - name: Photograph the demonstration
        run: |
          cd aui
          mkdir -p pictures
          build/aui --demo --size 1400x900 --shot pictures/macos-release-wide.png
          build/aui --version
          ls -la pictures

      - name: Exercise live turns
        timeout-minutes: 30
        env:
          AUI_EXERCISE_SHOTS: ${{ github.workspace }}/aui/pictures/live
          AUI_EXERCISE_KEEP: ${{ github.workspace }}/aui/pictures/live-world
        run: |
          cd aui
          mkdir -p pictures/live
          script/exercise-live

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aui-macos-release-pictures
          path: |
            aui/pictures
            aui/build/build.log
          if-no-files-found: warn

  macos:
    name: macOS arm64, Autolith from source
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          path: aui

      - uses: actions/checkout@v5
        with:
          repository: lambda-symbolics/autolith
          ref: ${{ env.AUTOLITH_REF }}
          path: autolith

      - uses: actions/checkout@v5
        with:
          repository: lambda-symbolics/lightfast
          path: lightfast

      - name: Install tools
        run: |
          brew install sbcl fltk rust cmake pkg-config openssl coreutils gnu-tar
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          sbcl --version
          fltk-config --version

      # Nothing is cached between runs. If compiled files are restored from an
      # earlier run, the TLS library of Autolith is bound to the wrong OpenSSL
      # symbols.
      - name: Install Quicklisp
        run: |
          curl --fail --location --retry 3 --output quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp --eval '(quicklisp-quickstart:install)'

      - name: Bootstrap Autolith
        run: |
          cd autolith
          ./script/bootstrap
          ./bin/autolith --version

      - name: Build AUI
        env:
          AUI_AUTOLITH_ROOT: ${{ github.workspace }}/autolith
          AUI_LIGHTFAST_ROOT: ${{ github.workspace }}/lightfast
        run: |
          cd aui
          script/build
          ls -la build/aui

      - name: Run the tests
        env:
          AUI_AUTOLITH_ROOT: ${{ github.workspace }}/autolith
          AUI_LIGHTFAST_ROOT: ${{ github.workspace }}/lightfast
        run: |
          cd aui
          script/check --suite aui

      - name: Exercise the interface
        env:
          AUI_AUTOLITH_ROOT: ${{ github.workspace }}/autolith
          AUI_LIGHTFAST_ROOT: ${{ github.workspace }}/lightfast
        run: |
          cd aui
          script/exercise
          script/exercise-unslop

      - name: Photograph the demonstration
        env:
          AUI_AUTOLITH_ROOT: ${{ github.workspace }}/autolith
          AUI_LIGHTFAST_ROOT: ${{ github.workspace }}/lightfast
        run: |
          cd aui
          mkdir -p pictures
          build/aui --demo --size 1400x900 --shot pictures/macos-wide.png
          build/aui --demo --size 760x1000 --shot pictures/macos-narrow.png
          build/aui --demo --size 1400x900 --view settings --shot pictures/macos-settings.png
          build/aui --demo --size 1400x900 --view commands --shot pictures/macos-commands.png
          build/aui --demo --size 1400x900 --view approval --shot pictures/macos-approval.png
          build/aui --version
          ls -la pictures

      - name: Exercise live turns
        timeout-minutes: 25
        env:
          AUI_AUTOLITH_ROOT: ${{ github.workspace }}/autolith
          AUI_LIGHTFAST_ROOT: ${{ github.workspace }}/lightfast
          AUI_EXERCISE_SHOTS: ${{ github.workspace }}/aui/pictures/live
          AUI_EXERCISE_KEEP: ${{ github.workspace }}/aui/pictures/live-world
        run: |
          cd aui
          mkdir -p pictures/live
          script/exercise-live

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aui-macos-pictures
          path: |
            aui/pictures
            aui/build/build.log
          if-no-files-found: warn
